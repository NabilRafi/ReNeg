<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img" aria-labelledby="t d">
<title id="t">How ReNeg scores a test batch</title>
<desc id="d">A test batch goes to the base detector (TANL or TINS), which gives a score and an ID mask, and to ReNeg: each image is caught by its nearest name among the ID classes and the knowledge-graph pool; knowledge-graph names are gated by a lower confidence bound on their margins and by the base's vote; the caught images of trusted names form visual prototypes; images that both CLIP and the base trust as ID form the ID image prototypes. The image score compares an image with both sets of prototypes and is fused with the base score.</desc>
<style>
  .bg { fill: #ffffff; }
  .base { fill: #f1f3f5; stroke: #adb5bd; stroke-width: 1; }
  .ours { fill: #eeebff; stroke: #7c6fe0; stroke-width: 1; }
  .th { font: 600 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .ts { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
  .lab { font: italic 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
  .arr { stroke: #6e7781; stroke-width: 1.4; fill: none; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6e7781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="680" height="620"/>

<rect class="base" x="170" y="30" width="230" height="44" rx="8"/>
<text class="th" x="285" y="52" text-anchor="middle" dominant-baseline="central">Test batch (256 images)</text>

<rect class="base" x="440" y="30" width="200" height="44" rx="8"/>
<text class="th" x="540" y="45" text-anchor="middle" dominant-baseline="central">KG pool</text>
<text class="ts" x="540" y="62" text-anchor="middle" dominant-baseline="central">14,526 WordNet names</text>

<rect class="base" x="40" y="120" width="260" height="56" rx="8"/>
<text class="th" x="170" y="139" text-anchor="middle" dominant-baseline="central">Base detector (TANL / TINS)</text>
<text class="ts" x="170" y="158" text-anchor="middle" dominant-baseline="central">score and ID mask, unchanged</text>

<rect class="ours" x="380" y="120" width="260" height="56" rx="8"/>
<text class="th" x="510" y="139" text-anchor="middle" dominant-baseline="central">Catch each image</text>
<text class="ts" x="510" y="158" text-anchor="middle" dominant-baseline="central">nearest name: ID class or KG name</text>

<rect class="ours" x="380" y="216" width="260" height="56" rx="8"/>
<text class="th" x="510" y="235" text-anchor="middle" dominant-baseline="central">Gate each KG name</text>
<text class="ts" x="510" y="254" text-anchor="middle" dominant-baseline="central">LCB on its margins + the base's vote</text>

<rect class="ours" x="40" y="312" width="260" height="56" rx="8"/>
<text class="th" x="170" y="331" text-anchor="middle" dominant-baseline="central">ID image prototypes</text>
<text class="ts" x="170" y="350" text-anchor="middle" dominant-baseline="central">images CLIP and the base agree on</text>

<rect class="ours" x="380" y="312" width="260" height="56" rx="8"/>
<text class="th" x="510" y="331" text-anchor="middle" dominant-baseline="central">KG visual prototypes</text>
<text class="ts" x="510" y="350" text-anchor="middle" dominant-baseline="central">caught images of trusted names</text>

<rect class="ours" x="210" y="408" width="260" height="56" rx="8"/>
<text class="th" x="340" y="427" text-anchor="middle" dominant-baseline="central">Image score</text>
<text class="ts" x="340" y="446" text-anchor="middle" dominant-baseline="central">balanced, max or safe</text>

<rect class="base" x="210" y="504" width="260" height="56" rx="8"/>
<text class="th" x="340" y="523" text-anchor="middle" dominant-baseline="central">Fused score</text>
<text class="ts" x="340" y="542" text-anchor="middle" dominant-baseline="central">0.75 · base log-odds + 0.25 · image score</text>

<path class="arr" d="M230 74 L230 97 L170 97 L170 118" marker-end="url(#a)"/>
<path class="arr" d="M340 74 L340 97 L470 97 L470 118" marker-end="url(#a)"/>
<path class="arr" d="M580 74 L580 118" marker-end="url(#a)"/>
<path class="arr" d="M510 176 L510 214" marker-end="url(#a)"/>
<path class="arr" d="M510 272 L510 310" marker-end="url(#a)"/>
<path class="arr" d="M130 176 L130 310" marker-end="url(#a)"/>
<text class="lab" x="138" y="246">ID mask</text>
<path class="arr" d="M250 176 L250 244 L378 244" marker-end="url(#a)"/>
<text class="lab" x="292" y="237">vote</text>
<path class="arr" d="M260 368 L260 406" marker-end="url(#a)"/>
<path class="arr" d="M420 368 L420 406" marker-end="url(#a)"/>
<path class="arr" d="M40 148 L22 148 L22 532 L208 532" marker-end="url(#a)"/>
<text class="lab" x="28" y="440">score</text>
<path class="arr" d="M340 464 L340 502" marker-end="url(#a)"/>

<rect class="ours" x="222" y="584" width="12" height="12" rx="2"/>
<text class="ts" x="240" y="590" dominant-baseline="central">added by ReNeg (learned online, reset per stream)</text>
<rect class="base" x="222" y="602" width="12" height="12" rx="2" transform="translate(0,-2)"/>
<text class="ts" x="240" y="606" dominant-baseline="central">base detector and inputs</text>
</svg>
